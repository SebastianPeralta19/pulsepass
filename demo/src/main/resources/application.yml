spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pulsepass
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
  flyway:
    enabled: true

pulsepass:
  security:
    jwt:
      issuer: ${PULSEPASS_JWT_ISSUER:pulsepass-api}
      # Sin valor por defecto: la aplicación falla al arrancar si no se define.
      secret-base64: ${PULSEPASS_JWT_SECRET_BASE64:}
      access-token-ttl: ${PULSEPASS_JWT_ACCESS_TTL:PT15M}
    cors:
      # Lista separada por comas. Vacío = CORS deshabilitado (denegar por defecto).
      allowed-origins: ${PULSEPASS_CORS_ALLOWED_ORIGINS:}
